                try { return JSON.parse(localStorage.getItem('jobPortalAppliedJobs')) || [1, 3]; } catch { return [1, 3]; }
            });
            const [savedJobs, setSavedJobs] = useState(() => {
                try { return JSON.parse(localStorage.getItem('jobPortalSavedJobs')) || [2]; } catch { return [2]; }
            });
            const [interviews] = useState(() => {
                try { return JSON.parse(localStorage.getItem('jobPortalInterviews')) || []; } catch { return []; }
            });
            const [profile, setProfile] = useState(() => {
                const defaultProfile = {
                    name: 'Sarah Collins',
                    role: 'Frontend Developer',
                    location: 'Bengaluru, India',
                    email: 'sarah.collins@example.com',
                    bio: 'Frontend developer with 4+ years building accessible, high-performance interfaces. Passionate about design systems and delightful micro-interactions.'
                };
                try { return JSON.parse(localStorage.getItem('jobPortalProfile'))?.profile || defaultProfile; } catch { return defaultProfile; }
            });
            const [profileSkills, setProfileSkills] = useState(() => {
                try { return JSON.parse(localStorage.getItem('jobPortalProfile'))?.skills || ['React', 'JavaScript', 'CSS', 'UI/UX', 'Bootstrap']; } catch { return ['React', 'JavaScript', 'CSS', 'UI/UX', 'Bootstrap']; }
            });
            const [profilePicture, setProfilePicture] = useState(() => localStorage.getItem('jobPortalProfilePicture') || '');

            const [registration, setRegistration] = useState({ fullName: '', email: '', password: '', experience: '', role: 'Frontend Developer' });
            const [login, setLogin] = useState({ email: '', password: '' });
            const [resetStep, setResetStep] = useState('email');
            const [resetForm, setResetForm] = useState({ email: '', otp: '', password: '' });
            const [resetErrors, setResetErrors] = useState({});
            const [authNotice, setAuthNotice] = useState('');
            const [regErrors, setRegErrors] = useState({});
            const [loginErrors, setLoginErrors] = useState({});

            const profileFromUser = (user) => {
                const serverProfile = user.profile || {};
                return {
                    name: user.name,
                    role: serverProfile.headline || 'Frontend Developer',
                    location: serverProfile.location || '',
                    email: user.email,
                    bio: serverProfile.bio || ''
                };
            };

            const applyAuthenticatedUser = (user) => {
                const nextProfile = profileFromUser(user);
                setProfile(nextProfile);
                setProfileSkills(user.profile?.skills || []);
                setProfilePicture(localStorage.getItem(`jobPortalProfilePicture:${user.email}`) || '');
                localStorage.removeItem('jobPortalProfile');
                localStorage.removeItem('jobPortalProfilePicture');
            };

            useEffect(() => {
                document.body.classList.toggle('theme-dark-body', darkMode);
                localStorage.setItem('jobPortalTheme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            useEffect(() => {
                const handleMove = (e) => {
                    const spotlight = document.getElementById('ambient-spotlight');
                    if (spotlight) {
                        spotlight.style.transform = `translate(${e.clientX - 275}px, ${e.clientY - 275}px)`;
                        spotlight.style.opacity = '1';
                    }
                };
                window.addEventListener('mousemove', handleMove);
                return () => window.removeEventListener('mousemove', handleMove);
            }, []);

            const validateRegister = (values) => {
                const errors = {};
                if (!values.fullName.trim()) errors.fullName = 'Full name is required';
                if (!values.email.trim()) errors.email = 'Email is required';
                else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Enter a valid email';
                if (!values.password) errors.password = 'Password is required';
                else if (values.password.length < 8) errors.password = 'Minimum 8 characters';
                if (!values.experience.trim()) errors.experience = 'Experience is required';
                if (!values.role.trim()) errors.role = 'Role is required';
                return errors;
            };

            const validateLogin = (values) => {
                const errors = {};
                if (!values.email.trim()) errors.email = 'Email is required';
                else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email)) errors.email = 'Enter a valid email';
                if (!values.password) errors.password = 'Password is required';
                return errors;
            };

            const handleRegistrationChange = (event) => {
                const { name, value } = event.target;
                setRegistration((prev) => ({ ...prev, [name]: value }));
                setRegErrors((prev) => ({ ...prev, [name]: '' }));
            };

            const handleLoginChange = (event) => {
                const { name, value } = event.target;
                setLogin((prev) => ({ ...prev, [name]: value }));
                setLoginErrors((prev) => ({ ...prev, [name]: '' }));
            };

            const handleResetChange = (event) => {
                const { name, value } = event.target;
                setResetForm((prev) => ({ ...prev, [name]: value }));
                setResetErrors((prev) => ({ ...prev, [name]: '' }));
            };

            const handleForgotPassword = async (event) => {
                event.preventDefault();
                const email = resetForm.email.trim();
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    setResetErrors({ email: 'Enter a valid email' });
                    return;
                }
                if (!window.JobPortalApi || window.location.protocol === 'file:') {
                    setResetErrors({ email: 'Start the backend to send an OTP' });
                    return;
                }
                try {
                    await window.JobPortalApi.requestPasswordReset(email);
                    setResetForm((prev) => ({ ...prev, email }));
                    setResetStep('otp');
                    setResetErrors({});
                    setAuthNotice('OTP sent. Check your email.');
                } catch (error) {
                    setResetErrors({ email: error.message });
                }
            };

            const handleResetPassword = async (event) => {
                event.preventDefault();
                const errors = {};
                if (!/^\d{6}$/.test(resetForm.otp)) errors.otp = 'Enter the 6-digit OTP';
                if (resetForm.password.length < 8) errors.password = 'Minimum 8 characters';
                if (Object.keys(errors).length > 0) {
                    setResetErrors(errors);
                    return;
                }
                try {
                    await window.JobPortalApi.resetPassword({ email: resetForm.email, otp: resetForm.otp, password: resetForm.password });
                    setLogin({ email: resetForm.email, password: '' });
                    setResetForm({ email: '', otp: '', password: '' });
                    setResetStep('email');
                    setResetErrors({});
                    setAuthNotice('Password reset successfully. Log in with your new password.');
                    setMode('login');
                } catch (error) {
                    setResetErrors({ otp: error.message });
                }
            };

            const handleRegisterSubmit = async (event) => {
                event.preventDefault();
                const errors = validateRegister(registration);
                setRegErrors(errors);
                if (Object.keys(errors).length === 0) {
                    if (window.JobPortalApi && window.location.protocol !== 'file:') {
                        try {
                            const response = await window.JobPortalApi.register({
                                name: registration.fullName,
                                email: registration.email,
                                password: registration.password,
                                role: 'candidate'
                            });
                            localStorage.setItem('jobPortalToken', response.token);
                            applyAuthenticatedUser(response.user);
                        } catch (error) {
                            setRegErrors({ [error.field || 'email']: error.message });
                            return;
                        }
                    }
                    setLoggedIn(true);
                    setMode('login');
                    setActiveTab('Dashboard');
                }
            };

            const handleLoginSubmit = async (event) => {
                event.preventDefault();
                const errors = validateLogin(login);
                setLoginErrors(errors);
                if (Object.keys(errors).length === 0) {
                    if (window.JobPortalApi && window.location.protocol !== 'file:') {
                        try {
                            const response = await window.JobPortalApi.login(login);
                            localStorage.setItem('jobPortalToken', response.token);
                            applyAuthenticatedUser(response.user);
                        } catch (error) {
                            setLoginErrors({ [error.field || 'email']: error.message });
                            return;
                        }
                    }
                    setLoggedIn(true);
                    setActiveTab('Dashboard');
                }
            };

            const handleApply = (jobId, externalUrl) => {
                if (externalUrl && (externalUrl.startsWith('http://') || externalUrl.startsWith('https://'))) {
                    window.open(externalUrl, '_blank', 'noopener,noreferrer');
                }
                setAppliedJobs((prev) => {
                if (prev.includes(jobId)) return prev;
                const next = [...prev, jobId];
                localStorage.setItem('jobPortalAppliedJobs', JSON.stringify(next));
                return next;
            });
            };
            const handleSave = (jobId) => setSavedJobs((prev) => {
                const next = prev.includes(jobId) ? prev.filter(id => id !== jobId) : [...prev, jobId];
                localStorage.setItem('jobPortalSavedJobs', JSON.stringify(next));
                return next;
            });
            const handleProfileSaved = (nextProfile, nextSkills, nextPicture = profilePicture) => {
                setProfile(nextProfile);
                setProfileSkills(nextSkills);
                setProfilePicture(nextPicture || '');
            };

            const rememberCurrentTab = () => setPreviousTab(activeTab);
            const showDashboard = () => { rememberCurrentTab(); setSavedOnly(false); setApplicationsOnly(false); setInterviewsOnly(false); setActiveTab('Dashboard'); };
            const showSavedJobs = () => { rememberCurrentTab(); setSavedOnly(true); setApplicationsOnly(false); setInterviewsOnly(false); setActiveTab('Discover'); };
            const showApplications = () => { rememberCurrentTab(); setSavedOnly(false); setApplicationsOnly(true); setInterviewsOnly(false); setActiveTab('Dashboard'); };
            const showInterviews = () => { rememberCurrentTab(); setSavedOnly(false); setApplicationsOnly(false); setInterviewsOnly(true); setActiveTab('Messages'); };
            const navigate = (tab) => {
                if (tab === 'Dashboard') showDashboard();
                else if (tab === 'Discover') { rememberCurrentTab(); setSavedOnly(false); setApplicationsOnly(false); setInterviewsOnly(false); setActiveTab('Discover'); }
                else { rememberCurrentTab(); setSavedOnly(false); setApplicationsOnly(false); setInterviewsOnly(false); setActiveTab(tab); }
            };

            const handleBack = () => {
                const destination = previousTab || 'Dashboard';
                setSavedOnly(false);
                setApplicationsOnly(false);
                setInterviewsOnly(false);
                setActiveTab(destination);
                setPreviousTab('Dashboard');
            };

            const handleLogout = () => {
                setLoggedIn(false);
                setMode('login');
                setActiveTab('Dashboard');
            };

            const handleToggleTheme = () => setDarkMode((current) => !current);

            return (
                <div className={`portal-shell ${darkMode ? 'theme-dark' : ''}`}>
                    <div id="ambient-spotlight" />
                    <div className="floating-orb orb-one" />
                    <div className="floating-orb orb-four" />
                    <div className="floating-orb orb-two" />
                    <div className="floating-orb orb-three" />

                    {!loggedIn ? (
                        <div className="container auth-container py-5">
                            <div className="row align-items-center justify-content-center min-vh-100 g-4">
                                <div className="col-lg-5 order-2 order-lg-1">
                                    <div className="portal-intro" data-aos="fade-right">
                                        <div className="portal-badge mb-3">Talent meet opportunity</div>
                                        <h1 className="display-4 fw-bold mb-3">Build a brighter career with the <span className="hero-highlight">right job match.</span></h1>
                                        <p className="lead text-secondary mb-4">
                                            Discover curated jobs, showcase your profile, and connect with employers that value your skills.
                                        </p>
                                        <ul className="list-unstyled feature-list">
                                            <li><i className="bi bi-check-circle-fill me-2 text-primary" />Quick registration and profile build</li>
                                            <li><i className="bi bi-check-circle-fill me-2 text-primary" />Responsive dashboard and job filters</li>
                                            <li><i className="bi bi-check-circle-fill me-2 text-primary" />Smart search to find ideal roles faster</li>
                                        </ul>
                                        <div className="career-preview-card floating-element-alt mt-4">
                                            <div className="career-preview-top">
                                                <span className="career-preview-eyebrow">FEATURED OPPORTUNITY</span>
                                                <span className="career-preview-live"><span className="badge-live-dot" /> OPEN ROLE</span>
                                            </div>
                                            <div className="career-preview-main">
                                                <span className="career-preview-icon"><i className="bi bi-braces-asterisk" /></span>
                                                <div>
                                                    <h6>Frontend Developer</h6>
                                                    <p>PixelWorks <span aria-hidden="true">·</span> Remote</p>
                                                </div>
                                            </div>
                                            <div className="career-preview-tags" aria-label="Role skills">
                                                <span>React</span><span>UI/UX</span><span>Bootstrap</span>
                                            </div>
                                            <div className="career-preview-footer">
                                                <span className="career-preview-salary"><i className="bi bi-cash-stack me-1" />$85k – $110k</span>
                                                <span className="career-preview-link">Explore roles <i className="bi bi-arrow-up-right ms-1" /></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="col-lg-6 order-1 order-lg-2">
                                    <div className="card auth-card border-0 shadow-lg" data-aos="zoom-in">
                                        <div className="card-body p-4 p-md-5">
                                            <div className="d-flex justify-content-end mb-3">
                                                <button className="btn btn-sm btn-outline-primary rounded-pill theme-toggle" onClick={handleToggleTheme} title={darkMode ? 'Use light mode' : 'Use dark mode'}>
                                                    <i className={`bi ${darkMode ? 'bi-sun-fill' : 'bi-moon-stars-fill'} me-1`} />{darkMode ? 'Light mode' : 'Dark mode'}
                                                </button>
                                            </div>
                                            <div className="d-flex justify-content-center mb-4">
                                                <div className="btn-group" role="group">
                                                    <button className={`btn ${mode === 'login' ? 'btn-primary' : 'btn-outline-primary'} rounded-pill px-4`} onClick={() => setMode('login')}>Login</button>
                                                    <button className={`btn ${mode === 'register' ? 'btn-primary' : 'btn-outline-primary'} rounded-pill px-4`} onClick={() => setMode('register')}>Register</button>
                                                </div>
                                            </div>

                                            {mode === 'login' ? (
                                                <form key="login" onSubmit={handleLoginSubmit} noValidate>
                                                    <h3 className="text-center fw-bold mb-4">Welcome back</h3>
                                                    <FormField label="Email address" type="email" name="email" value={login.email} onChange={handleLoginChange} placeholder="name@example.com" icon="bi-envelope" error={loginErrors.email} />
                                                    <FormField label="Password" type="password" name="password" value={login.password} onChange={handleLoginChange} placeholder="••••••••" icon="bi-lock" error={loginErrors.password} />
                                                    <div className="d-flex justify-content-between align-items-center mb-4 small text-muted">
                                                        <label className="form-check-label"><input className="form-check-input me-2" type="checkbox" />Remember me</label>
                                                        <button type="button" className="btn btn-link p-0 text-decoration-none" onClick={() => { setMode('forgot'); setAuthNotice(''); setResetForm((prev) => ({ ...prev, email: login.email })); }}>Forgot password?</button>
                                                    </div>
                                                    <RippleButton type="submit" className="btn btn-primary w-100 rounded-pill py-3 fw-semibold">Login to dashboard</RippleButton>
                                                </form>
                                            ) : mode === 'register' ? (
                                                <form key="register" onSubmit={handleRegisterSubmit} noValidate>
                                                    <h3 className="text-center fw-bold mb-4">Create your profile</h3>
                                                    <FormField label="Full name" name="fullName" value={registration.fullName} onChange={handleRegistrationChange} placeholder="John Carter" icon="bi-person" error={regErrors.fullName} />
                                                    <FormField label="Email address" type="email" name="email" value={registration.email} onChange={handleRegistrationChange} placeholder="name@example.com" icon="bi-envelope" error={regErrors.email} />
                                                    <FormField label="Password" type="password" name="password" value={registration.password} onChange={handleRegistrationChange} placeholder="At least 8 characters" icon="bi-lock" error={regErrors.password} />
                                                    <FormField label="Experience" name="experience" value={registration.experience} onChange={handleRegistrationChange} placeholder="3+ years in design / development" icon="bi-briefcase" error={regErrors.experience} />
                                                    <div className="mb-3">
                                                        <label className="form-label fw-semibold">Target role</label>
                                                        <select name="role" className={`form-select ${regErrors.role ? 'is-invalid' : ''}`} value={registration.role} onChange={handleRegistrationChange}>
                                                            <option value="Frontend Developer">Frontend Developer</option>
                                                            <option value="UI/UX Designer">UI/UX Designer</option>
                                                            <option value="Data Analyst">Data Analyst</option>
                                                            <option value="Product Manager">Product Manager</option>
                                                        </select>
                                                        {regErrors.role && <div className="invalid-feedback d-block">{regErrors.role}</div>}
                                                    </div>
                                                    <RippleButton type="submit" className="btn btn-primary w-100 rounded-pill py-3 fw-semibold">Register and continue</RippleButton>
                                                </form>
                                            ) : (
                                                <form key="forgot" onSubmit={resetStep === 'email' ? handleForgotPassword : handleResetPassword} noValidate>
                                                    <h3 className="text-center fw-bold mb-2">Reset your password</h3>
                                                    <p className="text-center text-muted small mb-4">{resetStep === 'email' ? 'Enter your Gmail address to receive a one-time code.' : 'Enter the OTP from your email and choose a new password.'}</p>
                                                    {authNotice && <div className="alert alert-info py-2 small">{authNotice}</div>}
                                                    {resetStep === 'email' ? (
                                                        <>
                                                            <FormField label="Email address" type="email" name="email" value={resetForm.email} onChange={handleResetChange} placeholder="name@example.com" icon="bi-envelope" error={resetErrors.email} />
                                                            <RippleButton type="submit" className="btn btn-primary w-100 rounded-pill py-3 fw-semibold">Send OTP</RippleButton>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <FormField label="OTP" type="text" name="otp" value={resetForm.otp} onChange={handleResetChange} placeholder="6-digit code" icon="bi-shield-lock" error={resetErrors.otp} />
                                                            <FormField label="New password" type="password" name="password" value={resetForm.password} onChange={handleResetChange} placeholder="At least 8 characters" icon="bi-lock" error={resetErrors.password} />
                                                            <RippleButton type="submit" className="btn btn-primary w-100 rounded-pill py-3 fw-semibold">Set new password</RippleButton>
                                                        </>
                                                    )}
                                                    <button type="button" className="btn btn-link w-100 mt-3 text-decoration-none" onClick={() => { setMode('login'); setAuthNotice(''); }}>Back to login</button>
                                                </form>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="dashboard-wrapper">
                            <Navbar activeTab={activeTab} setActiveTab={navigate} onBack={handleBack} darkMode={darkMode} onToggleTheme={handleToggleTheme} onLogout={handleLogout} />

                            <div className="container py-4">
                                <div key={activeTab}>
                                    {activeTab === 'Dashboard' && (
                                        <DashboardTab
                                            appliedJobs={appliedJobs}
                                            savedJobs={savedJobs}
                                            interviews={interviews}
                                            onApply={handleApply}
                                            onSave={handleSave}
                                            goDiscover={() => navigate('Discover')}
                                            goSavedJobs={showSavedJobs}
                                            goApplications={showApplications}
                                            goProfile={() => navigate('Profile')}
                                            goMessages={showInterviews}
                                            showApplicationsOnly={applicationsOnly}
                                            profile={profile}
                                            profileSkills={profileSkills}
                                            profilePicture={profilePicture}
                                        />
                                    )}
                                    {activeTab === 'Discover' && (
                                        <DiscoverTab
                                            appliedJobs={appliedJobs}
                                            savedJobs={savedJobs}
                                            onApply={handleApply}
                                            onSave={handleSave}
                                            onlySaved={savedOnly}
                                        />
                                    )}
                                    {activeTab === 'Profile' && <ProfileTab profileData={profile} skillsData={profileSkills} profilePicture={profilePicture} onProfileSaved={handleProfileSaved} />}
                                    {activeTab === 'Messages' && <MessagesTab onlyInterviews={interviewsOnly} interviews={interviews} />}
                                    {activeTab === 'API Studio' && <ApiStudioTab />}
                                </div>
                            </div>
                            <footer className="pw-footer">JobPortal demo · Built with React &amp; Bootstrap</footer>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        setTimeout(() => {
            if (window.AOS) window.AOS.refresh();
        }, 100);
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        if (window.AOS) { window.AOS.init({ duration: 700, once: true }); }
    </script>
</body>

</html>
