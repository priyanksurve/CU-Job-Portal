<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobPortal — Find your next role</title>

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet" />

    <!-- AOS (scroll animation library used in the component via data-aos attributes) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- React + Babel -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="api-client.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

    <style>
        :root {
            --ink: #101828;
            --primary: #2F5AF0;
            --primary-soft: #EAF0FF;
            --amber: #FFB703;
            --success: #2ECC71;
            --danger: #E5484D;
            --paper: #F4F6FB;
            --muted: #5B6472;
            --line: #E4E8F0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            transition: background-color .35s ease, color .35s ease;
        }

        body.theme-dark-body {
            background: #0d1524;
        }

        .theme-dark {
            --paper: #0d1524;
            --ink: #edf3ff;
            --muted: #a5b1c5;
            --line: #2b3952;
            --primary-soft: #1b2b52;
            color: var(--ink);
            transition: background-color .35s ease, color .35s ease;
        }

        .theme-dark .auth-card,
        .theme-dark .profile-card,
        .theme-dark .panel-card,
        .theme-dark .metric-card,
        .theme-dark .job-card,
        .theme-dark .endpoint-card,
        .theme-dark .schema-card,
        .theme-dark .chat-panel {
            background: #162238 !important;
            color: var(--ink);
            border-color: var(--line) !important;
        }

        .theme-dark .welcome-banner,
        .theme-dark .profile-hero {
            background: linear-gradient(135deg, #162238, #1b2b52);
        }

        .theme-dark .text-secondary,
        .theme-dark .text-muted {
            color: var(--muted) !important;
        }

        .theme-dark .form-control,
        .theme-dark .form-select,
        .theme-dark textarea {
            background: #101b2e;
            color: var(--ink);
            border-color: var(--line);
        }

        .theme-dark .form-control::placeholder {
            color: #7f8ca3;
        }

        .theme-dark .input-group-text {
            background: #101b2e !important;
            color: var(--muted);
            border-color: var(--line);
        }

        .theme-dark .bg-light {
            background: #22324b !important;
            color: var(--ink) !important;
            border-color: var(--line) !important;
        }

        .theme-dark .alert-menu {
            background: #162238;
            color: var(--ink);
            border-color: var(--line);
        }

        .theme-dark .alert-item {
            background: #101b2e;
        }

        .theme-dark .thread-item:hover,
        .theme-dark .application-item:hover {
            background: #1e2d45;
        }

        .theme-dark .thread-item.active {
            background: #1b2b52;
        }

        .theme-dark .bubble.them {
            background: #22324b;
            color: var(--ink);
        }

        .theme-dark .discover-hero,
        .theme-dark .api-hero {
            box-shadow: 0 20px 50px -35px rgba(0, 0, 0, .8);
        }

        .theme-toggle i {
            display: inline-block;
            transition: transform .35s ease;
        }

        .theme-toggle:hover i {
            transform: rotate(25deg) scale(1.15);
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Sora', sans-serif;
        }

        /* ============ Keyframes ============ */
        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -40px) scale(1.08);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeSlideRight {
            from {
                opacity: 0;
                transform: translateX(-16px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes zoomInSoft {
            from {
                opacity: 0;
                transform: scale(.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes popBadge {
            from {
                opacity: 0;
                transform: scale(.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes tabFade {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseDot {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, .55);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(46, 204, 113, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
            }
        }

        @keyframes typingBounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: .4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200px 0;
            }

            100% {
                background-position: calc(200px + 100%) 0;
            }
        }

        @keyframes underlineSlide {
            from {
                transform: scaleX(0);
                opacity: 0;
            }

            to {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        @keyframes chipPop {
            0% {
                opacity: 0;
                transform: scale(.6);
            }

            70% {
                transform: scale(1.08);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes ripple {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(16px) translateX(-50%);
            }

            to {
                opacity: 1;
                transform: translateY(0) translateX(-50%);
            }
        }

        @keyframes spinSlow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .001ms !important;
                transition-duration: .001ms !important;
            }
        }

        /* ============ Landing / auth screen ============ */
        .portal-shell {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .35;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite;
        }

        .orb-one {
            width: 380px;
            height: 380px;
            background: var(--primary);
            top: -100px;
            left: -100px;
        }

        .orb-two {
            width: 320px;
            height: 320px;
            background: var(--amber);
            bottom: -80px;
            right: -60px;
            animation-delay: 2s;
        }

        .orb-three {
            width: 260px;
            height: 260px;
            background: #7C5CFC;
            top: 40%;
            right: 20%;
            animation-delay: 4s;
        }

        .orb-four {
            width: 290px;
            height: 290px;
            background: #2ECC71;
            bottom: 15%;
            left: 20%;
            animation-delay: 6s;
        }

        .auth-container {
            position: relative;
            z-index: 1;
        }

        .portal-badge {
            display: inline-block;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 700;
            font-size: .78rem;
            letter-spacing: .04em;
            text-transform: uppercase;
            padding: .4rem 1rem;
            border-radius: 999px;
            animation: popBadge .5s ease both;
        }

        .portal-intro[data-aos] {
            animation: fadeSlideUp .7s ease both;
        }

        .feature-list li {
            padding: .4rem 0;
            color: var(--muted);
            font-size: .95rem;
            opacity: 0;
            animation: fadeSlideRight .5s ease forwards;
        }

        .feature-list li:nth-child(1) {
            animation-delay: .15s;
        }

        .feature-list li:nth-child(2) {
            animation-delay: .3s;
        }

        .feature-list li:nth-child(3) {
            animation-delay: .45s;
        }

        .auth-card {
            border-radius: 22px;
            background: #fff;
            animation: zoomInSoft .5s cubic-bezier(.2, .8, .2, 1) both;
        }

        .auth-card .btn-group .btn {
            font-weight: 600;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .auth-card .btn-group .btn:active {
            transform: scale(.96);
        }

        .auth-card .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .auth-card .btn-outline-primary {
            color: var(--primary);
            border-color: var(--primary);
        }

        .auth-card .btn-primary:hover {
            background: #2148CF;
            border-color: #2148CF;
            transform: translateY(-1px);
            box-shadow: 0 10px 18px -10px rgba(47, 90, 240, .55);
        }

        .auth-card form {
            animation: tabFade .35s ease both;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            border: 1.5px solid var(--line);
            padding: .6rem .85rem;
            transition: border-color .15s ease, box-shadow .15s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(47, 90, 240, .14);
        }

        .input-group-text {
            border-radius: 10px 0 0 10px;
            border: 1.5px solid var(--line);
            border-right: none;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }

        .is-invalid {
            animation: shakeX .35s ease;
        }

        @keyframes shakeX {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-4px);
            }

            40% {
                transform: translateX(4px);
            }

            60% {
                transform: translateX(-3px);
            }

            80% {
                transform: translateX(3px);
            }
        }

        /* ============ Navbar ============ */
        .portal-navbar {
            background: var(--ink);
            background-image: linear-gradient(120deg, var(--ink), #1E2A55);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--amber);
            color: var(--ink);
            font-weight: 800;
            margin-right: .3rem;
        }

        .navbar-brand span {
            color: var(--amber);
        }

        .nav-link {
            color: rgba(255, 255, 255, .7) !important;
            font-weight: 500;
            position: relative;
            transition: color .18s ease;
        }

        .nav-link:hover {
            color: #fff !important;
        }

        .nav-link.active-tab {
            color: #fff !important;
            font-weight: 700;
        }

        .nav-link.active-tab::after {
            content: '';
            position: absolute;
            left: 4px;
            right: 4px;
            bottom: -6px;
            height: 3px;
            background: linear-gradient(90deg, var(--amber), #FFD166);
            border-radius: 3px;
            transform-origin: center;
            animation: underlineSlide .3s cubic-bezier(.2, .8, .2, 1) both;
        }

        .btn-outline-light {
            position: relative;
            overflow: hidden;
        }

        .alert-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            position: absolute;
            top: 6px;
            right: 10px;
            animation: pulseDot 1.6s infinite;
        }

        .alert-menu {
            position: absolute;
            right: 0;
            top: calc(100% + .65rem);
            width: min(340px, calc(100vw - 2rem));
            background: #fff;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: .8rem;
            box-shadow: 0 18px 40px -20px rgba(16, 24, 40, .55);
            z-index: 20;
            animation: zoomInSoft .2s ease both;
        }

        .alert-item {
            display: flex;
            gap: .7rem;
            padding: .7rem;
            border-radius: 10px;
            background: var(--paper);
            font-size: .8rem;
        }

        .alert-item+.alert-item {
            margin-top: .5rem;
        }

        .alert-item i {
            color: var(--primary);
            font-size: 1rem;
        }

        .resume-actions input[type='file'] {
            display: none;
        }

        .resume-file-name {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ============ Dashboard shell ============ */
        .dashboard-wrapper {
            position: relative;
            z-index: 1;
            animation: fadeSlideUp .5s ease both;
        }

        .tab-content-area {
            animation: tabFade .4s cubic-bezier(.2, .8, .2, 1) both;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #fff, var(--primary-soft));
            border-radius: 20px;
            animation: fadeSlideUp .5s ease both;
            position: relative;
            overflow: hidden;
        }

        .welcome-banner::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(47, 90, 240, .12), transparent 70%);
            animation: floatOrb 8s ease-in-out infinite;
        }

        .profile-card {
            background: #fff;
            border-radius: 20px;
            padding: 1.5rem;
            animation: fadeSlideUp .55s ease both;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #7C5CFC);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: 'Sora';
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-lg {
            width: 88px;
            height: 88px;
            font-size: 1.7rem;
        }

        .metric-card {
            background: #fff;
            border-radius: 16px;
            padding: 1.3rem;
            text-align: center;
            opacity: 0;
            animation: fadeSlideUp .5s ease forwards;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 30px -20px rgba(16, 24, 40, .35);
        }

        .metric-card[role='button'] {
            cursor: pointer;
        }

        .metric-card[role='button']:focus-visible {
            outline: 3px solid rgba(47, 90, 240, .35);
            outline-offset: 3px;
        }

        .metric-card:nth-child(1) {
            animation-delay: .05s;
        }

        .metric-card:nth-child(2) {
            animation-delay: .15s;
        }

        .metric-card:nth-child(3) {
            animation-delay: .25s;
        }

        .metric-card:nth-child(4) {
            animation-delay: .35s;
        }

        .metric-card .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto .7rem;
            font-size: 1.1rem;
            transition: transform .3s ease;
        }

        .metric-card:hover .icon-box {
            transform: scale(1.12) rotate(-6deg);
        }

        .metric-value {
            font-family: 'Sora';
            font-weight: 800;
            font-size: 1.5rem;
        }

        .metric-label {
            color: var(--muted);
            font-size: .8rem;
        }

        .panel-card {
            background: #fff;
            border-radius: 20px;
            padding: 1.6rem;
            animation: fadeSlideUp .5s ease both;
        }

        .search-box {
            min-width: 220px;
            border-radius: 10px;
        }

        .filter-select {
            min-width: 160px;
            border-radius: 10px;
        }

        .job-card {
            border-radius: 18px;
            transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s ease, border-color .22s ease;
            opacity: 0;
            animation: fadeSlideUp .45s ease forwards;
            border: 1px solid transparent !important;
        }

        .job-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -22px rgba(16, 24, 40, .35) !important;
            border-color: var(--line) !important;
        }

        .job-card .btn-light {
            transition: transform .18s ease, color .18s ease;
        }

        .job-card .btn-light:hover {
            transform: scale(1.15);
            color: var(--amber);
        }

        .job-card .btn-light.saved {
            color: var(--amber);
        }

        .text-bg-primary-soft {
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 600;
        }

        .application-item {
            opacity: 0;
            animation: fadeSlideRight .4s ease forwards;
            transition: background .15s ease;
            border-radius: 10px;
        }

        .application-item:hover {
            background: var(--paper);
        }

        .empty-state {
            color: var(--muted);
            animation: fadeSlideUp .4s ease both;
        }

        .empty-state i {
            animation: floatOrb 4s ease-in-out infinite;
            display: inline-block;
        }

        .progress-card .progress {
            border-radius: 6px;
            overflow: hidden;
            background: #EEF1F7;
        }

        .progress-card .progress-bar {
            transition: width 1.1s cubic-bezier(.2, .8, .2, 1);
        }

        footer.pw-footer {
            text-align: center;
            color: var(--muted);
            font-size: .82rem;
            padding: 1.5rem 0;
            position: relative;
            z-index: 1;
        }

        /* ============ Discover tab ============ */
        .discover-hero {
            background: linear-gradient(135deg, var(--ink), #1E2A55);
            color: #fff;
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            animation: fadeSlideUp .5s ease both;
        }

        .discover-hero::after {
            content: '';
            position: absolute;
            right: -40px;
            top: -40px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 183, 3, .25), transparent 70%);
            animation: floatOrb 9s ease-in-out infinite;
        }

        .level-pill {
            border: 1.5px solid var(--line);
            background: #fff;
            border-radius: 999px;
            padding: .35rem .9rem;
            font-size: .82rem;
            font-weight: 600;
            color: var(--muted);
            transition: all .18s ease;
            cursor: pointer;
        }

        .level-pill.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
        }

        .level-pill:hover {
            transform: translateY(-2px);
        }

        /* ============ Profile tab ============ */
        .profile-hero {
            background: linear-gradient(135deg, #fff, var(--primary-soft));
            border-radius: 20px;
            padding: 2rem;
            animation: fadeSlideUp .5s ease both;
        }

        .skill-chip {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: var(--primary-soft);
            color: var(--primary);
            border-radius: 999px;
            padding: .35rem .85rem;
            font-size: .85rem;
            font-weight: 600;
            animation: chipPop .3s cubic-bezier(.2, .8, .2, 1) both;
        }

        .skill-chip button {
            border: none;
            background: transparent;
            color: var(--primary);
            line-height: 1;
            padding: 0;
            font-size: .9rem;
            opacity: .7;
        }

        .skill-chip button:hover {
            opacity: 1;
        }

        .save-toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            background: var(--ink);
            color: #fff;
            padding: .7rem 1.4rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: .85rem;
            z-index: 1000;
            animation: toastIn .35s cubic-bezier(.2, .8, .2, 1) both;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .save-toast i {
            color: var(--success);
        }

        /* ============ Messages tab ============ */
        .thread-list {
            max-height: 560px;
            overflow-y: auto;
        }

        .thread-item {
            display: flex;
            gap: .8rem;
            padding: .85rem;
            border-radius: 14px;
            cursor: pointer;
            transition: background .15s ease, transform .15s ease;
            opacity: 0;
            animation: fadeSlideRight .4s ease forwards;
        }

        .thread-item:hover {
            background: var(--paper);
        }

        .thread-item.active {
            background: var(--primary-soft);
        }

        .thread-item .unread-badge {
            background: var(--primary);
            color: #fff;
            font-size: .68rem;
            font-weight: 700;
            border-radius: 999px;
            padding: .1rem .45rem;
            animation: popBadge .3s ease both;
        }

        .chat-panel {
            background: #fff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            height: 600px;
            animation: zoomInSoft .4s ease both;
        }

        .chat-header {
            padding: 1rem 1.3rem;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: .8rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.3rem;
            display: flex;
            flex-direction: column;
            gap: .7rem;
        }

        .bubble {
            max-width: 70%;
            padding: .6rem 1rem;
            border-radius: 16px;
            font-size: .9rem;
            opacity: 0;
            animation: fadeSlideUp .35s ease forwards;
        }

        .bubble.them {
            background: var(--paper);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .bubble.me {
            background: var(--primary);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bubble-time {
            font-size: .68rem;
            color: var(--muted);
            margin-top: .15rem;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-self: flex-start;
            background: var(--paper);
            padding: .6rem 1rem;
            border-radius: 16px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: typingBounce 1.2s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: .3s;
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid var(--line);
            display: flex;
            gap: .6rem;
        }

        .status-online {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            border: 2px solid #fff;
            position: absolute;
            bottom: 0;
            right: 0;
            animation: pulseDot 2s infinite;
        }

        /* ripple button effect */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }

        .ripple-span {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            background: rgba(255, 255, 255, .55);
            animation: ripple .6s linear;
            pointer-events: none;
        }

        .spin-slow {
            animation: spinSlow 3s linear infinite;
            display: inline-block;
        }

        /* ============ API Studio tab ============ */
        .api-hero {
            background: linear-gradient(135deg, #101828 0%, #263c71 58%, #2f5af0 100%);
            color: #fff;
            border-radius: 20px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            animation: fadeSlideUp .5s ease both;
        }

        .api-hero::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            right: -70px;
            top: -100px;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 50%;
            box-shadow: 0 0 0 28px rgba(255, 255, 255, .04), 0 0 0 56px rgba(255, 255, 255, .03);
            animation: spinSlow 18s linear infinite;
        }

        .api-status {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .35rem .75rem;
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 999px;
            font-size: .78rem;
            color: rgba(255, 255, 255, .84);
        }

        .api-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(46, 204, 113, .15);
        }

        .api-stat {
            border-left: 2px solid var(--amber);
            padding-left: .8rem;
        }

        .api-stat strong {
            display: block;
            font: 800 1.25rem 'Sora', sans-serif;
        }

        .api-stat span {
            color: rgba(255, 255, 255, .65);
            font-size: .75rem;
        }

        .endpoint-card,
        .schema-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 1rem;
            height: 100%;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }

        .endpoint-card:hover,
        .schema-card:hover {
            transform: translateY(-4px);
            border-color: rgba(47, 90, 240, .35);
            box-shadow: 0 18px 30px -24px rgba(16, 24, 40, .55);
        }

        .method-badge {
            min-width: 48px;
            text-align: center;
            border-radius: 6px;
            padding: .28rem .45rem;
            font: 700 .68rem 'Sora', sans-serif;
        }

        .method-get {
            background: #e8f8ef;
            color: #16804a;
        }

        .method-post {
            background: #eaf0ff;
            color: #2f5af0;
        }

        .endpoint-path {
            color: var(--ink);
            font: 600 .84rem ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .schema-icon {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--primary-soft);
            color: var(--primary);
        }

        .schema-field {
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            padding: .5rem 0;
            border-bottom: 1px dashed var(--line);
            font-size: .8rem;
        }

        .schema-field:last-child {
            border-bottom: 0;
        }

        .schema-field code {
            color: var(--primary);
        }

        .schema-field span {
            color: var(--muted);
        }

        .code-panel {
            background: #101828;
            border-radius: 16px;
            color: #d7e0f0;
            padding: 1.2rem;
            overflow: auto;
            font: .78rem/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .code-panel .code-key {
            color: #84a9ff;
        }

        .code-panel .code-string {
            color: #ffd166;
        }

        .code-panel .code-comment {
            color: #7f8ca3;
        }

        .api-flow-step {
            position: relative;
            padding: .75rem 1rem .75rem 2.6rem;
            border-left: 1px solid var(--line);
            font-size: .84rem;
        }

        .api-flow-step::before {
            content: attr(data-step);
            position: absolute;
            left: -13px;
            top: .7rem;
            width: 25px;
            height: 25px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font: 700 .7rem 'Sora', sans-serif;
        }

        .api-flow-step strong {
            display: block;
            margin-bottom: .15rem;
        }

        .api-flow-step span {
            color: var(--muted);
        }
        /* ============ Naukri & Adzuna Live Aggregator Styles ============ */
        .naukri-link-btn {
            background-color: transparent;
            border: 1.5px solid #2F5AF0;
            color: #2F5AF0;
            font-weight: 600;
            font-size: .82rem;
            transition: all .2s cubic-bezier(.16, 1, .3, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
        }

        .naukri-link-btn:hover {
            background-color: #2F5AF0;
            color: #ffffff !important;
            box-shadow: 0 4px 14px rgba(47, 90, 240, .28);
            transform: translateY(-1px);
        }

        .theme-dark .naukri-link-btn {
            border-color: #5c85ff;
            color: #84a9ff;
        }

        .theme-dark .naukri-link-btn:hover {
            background-color: #2F5AF0;
            color: #fff !important;
        }

        .badge-live-job {
            background: rgba(46, 204, 113, .12);
            color: #16804a;
            border: 1px solid rgba(46, 204, 113, .3);
            font-size: .72rem;
            font-weight: 600;
            padding: .25rem .6rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: .35rem;
        }

        .theme-dark .badge-live-job {
            background: rgba(46, 204, 113, .18);
            color: #4ade80;
            border-color: rgba(46, 204, 113, .35);
        }

        .badge-live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, .25);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, .4); }
            70% { box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .adzuna-info-banner {
            background: linear-gradient(135deg, rgba(47, 90, 240, .06), rgba(124, 92, 252, .08));
            border: 1px solid rgba(47, 90, 240, .2);
            border-radius: 14px;
            padding: 1rem 1.25rem;
        }

        .theme-dark .adzuna-info-banner {
            background: linear-gradient(135deg, rgba(47, 90, 240, .14), rgba(124, 92, 252, .18));
            border-color: rgba(47, 90, 240, .35);
        }

        .quick-city-chip {
            padding: .28rem .8rem;
            font-size: .78rem;
            font-weight: 500;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            cursor: pointer;
            transition: all .18s ease;
            user-select: none;
        }

        .theme-dark .quick-city-chip {
            background: #101b2e;
            color: var(--muted);
            border-color: var(--line);
        }

        .quick-city-chip:hover,
        .quick-city-chip.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-soft);
        }

        .modal-custom-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(16, 24, 40, .6);
            backdrop-filter: blur(4px);
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-custom-card {
            background: #fff;
            border-radius: 18px;
            max-width: 540px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .25);
            animation: zoomModal .22s ease-out;
        }

        .theme-dark .modal-custom-card {
            background: #162238;
            color: var(--ink);
            border: 1px solid var(--line);
        }

        @keyframes zoomModal {
            from { transform: scale(.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Refined product styling */
        :root {
            --ink: #17233b;
            --primary: #5b5ce2;
            --primary-soft: #efefff;
            --amber: #ffbf69;
            --paper: #f6f7fb;
            --muted: #718096;
            --line: #e7eaf2;
            --success: #23a879;
            --surface: #fff;
            --shadow-soft: 0 16px 44px rgba(26, 38, 74, .075);
        }

        body {
            background: var(--paper);
            background-image: radial-gradient(ellipse at 12% 0%, rgba(91, 92, 226, .075), transparent 34%),
                radial-gradient(ellipse at 90% 90%, rgba(255, 191, 105, .10), transparent 28%);
            color: var(--ink);
            letter-spacing: -.01em;
        }

        .theme-dark {
            --paper: #0b1220;
            --ink: #edf2ff;
            --muted: #a1aec5;
            --line: #26344b;
            --primary-soft: #202342;
            --surface: #131e30;
            --shadow-soft: 0 18px 48px rgba(0, 0, 0, .24);
        }

        .theme-dark body { background: var(--paper); }
        .portal-shell.theme-dark { background: var(--paper); }
        .portal-shell { isolation: isolate; }
        .portal-shell::before { opacity: .42; }
        .floating-orb { opacity: .18; filter: blur(76px); }
        .orb-one { background: #7776ff; }
        .orb-two { background: #f5a959; }
        .orb-three { background: #aa8bff; }
        .orb-four { background: #44cba0; }

        h1, h2, h3, h4, h5, h6 { letter-spacing: -.045em; }
        .auth-container { max-width: 1180px; }
        .portal-intro { max-width: 510px; padding: 1.5rem 0; }
        .portal-intro h1 { line-height: 1.08; font-size: clamp(2.5rem, 5vw, 4.25rem); }
        .portal-badge { background: rgba(91, 92, 226, .10); color: #5556cf; padding: .55rem 1rem; }
        .auth-card { border-radius: 28px; box-shadow: 0 28px 80px rgba(37, 44, 87, .13) !important; }
        .auth-card .card-body { padding: clamp(1.5rem, 4vw, 3.25rem) !important; }
        .auth-card h3 { font-size: 1.8rem; }
        .form-control, .form-select { min-height: 48px; border-radius: 12px; background-color: var(--surface); }
        .form-control:focus, .form-select:focus { box-shadow: 0 0 0 4px rgba(91, 92, 226, .12); }

        .portal-navbar {
            background: rgba(20, 29, 53, .94);
            background-image: linear-gradient(110deg, rgba(20, 29, 53, .97), rgba(42, 48, 95, .96));
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 30px rgba(13, 22, 42, .16);
        }
        .portal-navbar .container { max-width: 1320px; }
        .brand-mark { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(145deg, #ffd18a, #ffb854); }
        .navbar-brand { letter-spacing: -.045em; }
        .nav-link { border-radius: 999px !important; padding: .55rem .9rem !important; }
        .nav-link.active-tab { background: rgba(255, 255, 255, .10); }
        .nav-link.active-tab::after { display: none; }

        .dashboard-wrapper { min-height: 100vh; }
        .dashboard-wrapper > .container { max-width: 1320px; padding-top: 2rem !important; }
        .welcome-banner, .discover-hero, .api-hero {
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
        }
        .welcome-banner { border: 1px solid rgba(91, 92, 226, .09); }
        .welcome-banner h2 { font-size: clamp(1.7rem, 3vw, 2.5rem); }
        .profile-card, .panel-card, .metric-card, .job-card, .endpoint-card, .schema-card,
        .chat-panel, .auth-card {
            border: 1px solid var(--line) !important;
            box-shadow: var(--shadow-soft) !important;
        }
        .panel-card, .profile-card { border-radius: 22px; }
        .metric-card { border-radius: 20px; background: var(--surface); }
        .metric-card:hover { transform: translateY(-5px) !important; }
        .icon-box { border-radius: 14px; }
        .job-card {
            border-radius: 20px;
            background: var(--surface);
            transition: transform .28s cubic-bezier(.2, .75, .25, 1), box-shadow .28s ease, border-color .28s ease !important;
        }
        .job-card:hover { transform: translateY(-6px) !important; box-shadow: 0 22px 48px rgba(29, 40, 84, .13) !important; border-color: rgba(91, 92, 226, .26) !important; }
        .job-card .card-body { padding: 1.45rem !important; }
        .job-card .card-title { letter-spacing: -.035em; }
        .btn { transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease; }
        .btn-primary { background: linear-gradient(135deg, #6263e9, #4e50cf); border-color: #5657d8; }
        .btn-primary:hover { background: linear-gradient(135deg, #5556d9, #4547bd); border-color: #4e50cf; animation: none !important; box-shadow: 0 10px 24px rgba(83, 84, 211, .25); }
        .btn-warning { background: linear-gradient(135deg, #ffd18b, #ffbd66); border-color: #ffc270; color: #2b2b43; }
        .endpoint-card, .schema-card { border-radius: 18px; }
        .code-panel { border: 1px solid rgba(255,255,255,.08); background: linear-gradient(145deg, #151d33, #202a48); }
        .pw-footer { color: var(--muted); padding: 1.5rem; }

        .theme-dark .auth-card, .theme-dark .profile-card, .theme-dark .panel-card,
        .theme-dark .metric-card, .theme-dark .job-card, .theme-dark .endpoint-card,
        .theme-dark .schema-card, .theme-dark .chat-panel {
            background: var(--surface) !important;
            box-shadow: var(--shadow-soft) !important;
        }
        .theme-dark .welcome-banner { background: linear-gradient(135deg, #151f34, #202545); }
        .theme-dark .btn-light { background: #202c42; color: var(--ink); border-color: var(--line); }
        .theme-dark .badge.bg-light { background: #202c42 !important; color: var(--ink) !important; border-color: var(--line) !important; }

        @media (max-width: 767.98px) {
            .auth-container { padding-top: 1.5rem !important; padding-bottom: 2rem !important; }
            .auth-container .row.min-vh-100 { min-height: auto !important; }
            .portal-intro { padding: .5rem .25rem 0; }
            .portal-intro h1 { font-size: 2.45rem; }
            .dashboard-wrapper > .container { padding-top: 1.25rem !important; }
            .welcome-banner, .discover-hero, .api-hero { border-radius: 21px; }
            .panel-card, .profile-card { border-radius: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-orb, .floating-element, .floating-element-alt, .badge-live-dot,
            .tab-content-area, .job-card, .metric-card, .portal-shell::before { animation: none !important; }
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
        /* ============ ULTRA ANIMATED EXPANSIONS ============ */

        /* 1. Dynamic background grid drift */
        .portal-shell::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(rgba(47, 90, 240, 0.08) 1.2px, transparent 1.2px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
            animation: gridDrift 80s linear infinite;
        }

        .theme-dark .portal-shell::before {
            background-image: radial-gradient(rgba(124, 92, 252, 0.14) 1.2px, transparent 1.2px);
        }

        @keyframes gridDrift {
            0% { background-position: 0 0; }
            100% { background-position: 280px 280px; }
        }

        /* 2. Floating interactive spotlight following cursor */
        #ambient-spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(47, 90, 240, 0.09) 0%, rgba(124, 92, 252, 0.04) 40%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity .4s ease, transform .07s ease-out;
        }

        .theme-dark #ambient-spotlight {
            background: radial-gradient(circle, rgba(92, 133, 255, 0.12) 0%, rgba(124, 92, 252, 0.06) 40%, transparent 70%);
        }

        /* 3. Multi-stop flowing animated gradients on Hero banners */
        .discover-hero, .api-hero, .welcome-banner, .profile-hero {
            background-size: 240% 240% !important;
            animation: gradientShift 12s ease-in-out infinite alternate !important;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 4. Rotating cosmic dashed decorative rings in hero banners */
        .discover-hero::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            left: -100px;
            bottom: -120px;
            border: 1.5px dashed rgba(255, 255, 255, .16);
            border-radius: 50%;
            animation: spinSlow 32s linear infinite;
            pointer-events: none;
        }

        /* 5. Next-level Job Cards & Shimmer Light Sweep */
        .job-card {
            position: relative;
            overflow: hidden;
            border-radius: 20px !important;
            transition: all .28s cubic-bezier(.16, 1, .3, 1) !important;
            border: 1px solid rgba(228, 232, 240, .8) !important;
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -70%;
            width: 220%;
            height: 220%;
            background: linear-gradient(
                115deg,
                transparent 0%,
                transparent 38%,
                rgba(255, 255, 255, 0.5) 50%,
                transparent 62%,
                transparent 100%
            );
            transform: rotate(25deg) translateY(-100%);
            transition: transform .7s cubic-bezier(.16, 1, .3, 1);
            pointer-events: none;
            z-index: 2;
        }

        .theme-dark .job-card::before {
            background: linear-gradient(
                115deg,
                transparent 0%,
                transparent 38%,
                rgba(255, 255, 255, 0.08) 50%,
                transparent 62%,
                transparent 100%
            );
        }

        .job-card:hover::before {
            transform: rotate(25deg) translateY(100%);
        }

        .job-card:hover {
            transform: translateY(-8px) scale(1.014) !important;
            box-shadow: 0 24px 50px -18px rgba(47, 90, 240, .32) !important;
            border-color: rgba(47, 90, 240, .45) !important;
        }

        .theme-dark .job-card:hover {
            box-shadow: 0 24px 50px -18px rgba(0, 0, 0, .75) !important;
            border-color: rgba(92, 133, 255, .5) !important;
        }

        /* 6. Staggered card entrance with spring curve */
        @keyframes cardEnterSpring {
            0% {
                opacity: 0;
                transform: translateY(32px) scale(.94);
            }
            70% {
                transform: translateY(-4px) scale(1.008);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .job-card {
            animation: cardEnterSpring .55s cubic-bezier(.16, 1, .3, 1) forwards !important;
        }

        /* 7. Animated Bookmark Save Pop with Burst */
        @keyframes bookmarkBurst {
            0% { transform: scale(1); }
            35% { transform: scale(1.4) rotate(-18deg); }
            65% { transform: scale(0.88) rotate(10deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .job-card .btn-light.saved i {
            animation: bookmarkBurst .45s cubic-bezier(.175, .885, .32, 1.275);
            color: var(--amber);
        }

        /* 8. Pulsing Live Radar Indicator */
        @keyframes pulseRadarWave {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, .8);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(46, 204, 113, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(46, 204, 113, 0);
            }
        }

        .badge-live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            position: relative;
            animation: pulseRadarWave 1.8s infinite;
        }

        /* 9. Animated Naukri Button with hover arrow glide */
        .naukri-link-btn {
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }

        .naukri-link-btn i {
            transition: transform .25s cubic-bezier(.16, 1, .3, 1);
        }

        .naukri-link-btn:hover i {
            transform: translate(2.5px, -2.5px) scale(1.15);
        }

        .naukri-link-btn:active {
            transform: scale(.97);
        }

        /* 10. Floating Interactive Badge Accents */
        @keyframes floatGentle {

        /* ============================================================

        ============================================================ */
        function useCountUp(target, duration = 900) {
            const [value, setValue] = useState(0);
            useEffect(() => {
                let start = null;
                let raf;
                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    setValue(Math.floor(progress * target));
                    if (progress < 1) raf = requestAnimationFrame(step);
                };
                raf = requestAnimationFrame(step);
                return () => cancelAnimationFrame(raf);
            }, [target, duration]);
            return value;
        }

        function RippleButton({ className, onClick, children, ...rest }) {
            const handleClick = (e) => {
                const btn = e.currentTarget;
                const circle = document.createElement('span');
                const diameter = Math.max(btn.clientWidth, btn.clientHeight);
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - btn.getBoundingClientRect().left - diameter / 2}px`;
                circle.style.top = `${e.clientY - btn.getBoundingClientRect().top - diameter / 2}px`;
                circle.className = 'ripple-span';
                const old = btn.querySelector('.ripple-span');
                if (old) old.remove();
                btn.appendChild(circle);
                setTimeout(() => circle.remove(), 600);
                if (onClick) onClick(e);
            };
            return (
                <button className={`ripple-btn ${className || ''}`} onClick={handleClick} {...rest}>
                    {children}
                </button>
            );
        }

        function ProfileTab({ profileData, skillsData, profilePicture, onProfileSaved }) {
            const [profile, setProfile] = useState(profileData);
            const [skills, setSkills] = useState(skillsData);
            const [newSkill, setNewSkill] = useState('');
            const [toast, setToast] = useState(false);
            const [toastMessage, setToastMessage] = useState('Profile updated successfully');
            const [resume, setResume] = useState(() => {
                try { return JSON.parse(localStorage.getItem(`jobPortalResume:${profileData.email}`)) || null; } catch { return null; }
            });

            const handleProfilePicture = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) return showToast('Choose an image file');
                if (file.size > 3 * 1024 * 1024) return showToast('Profile picture must be smaller than 3 MB');
                const reader = new FileReader();
                reader.onload = () => {
                    localStorage.setItem(`jobPortalProfilePicture:${profile.email}`, reader.result);
                    onProfileSaved(profile, skills, reader.result);
                    showToast('Profile picture updated');
                };
                reader.readAsDataURL(file);
                event.target.value = '';
            };

            const removeProfilePicture = () => {
                localStorage.removeItem(`jobPortalProfilePicture:${profile.email}`);
                onProfileSaved(profile, skills, '');
                showToast('Profile picture removed');
            };

            const handleChange = (e) => setProfile({ ...profile, [e.target.name]: e.target.value });

            const showToast = (message) => {
                setToastMessage(message);
                setToast(true);
                setTimeout(() => setToast(false), 2400);
            };

            const addSkill = (e) => {
                e.preventDefault();
                const val = newSkill.trim();
                if (val && !skills.includes(val)) {
                    setSkills([...skills, val]);
                }
                setNewSkill('');
            };

            const removeSkill = (skill) => setSkills(skills.filter((s) => s !== skill));

            const handleSave = async (e) => {
                e.preventDefault();
                const token = localStorage.getItem('jobPortalToken');
                if (window.JobPortalApi && token) {
                    try {
                        await window.JobPortalApi.updateProfile({
                            name: profile.name,
                            headline: profile.role,
                            location: profile.location,
                            bio: profile.bio,
                            skills
                        }, token);
                    } catch (error) {
                        showToast(error.message);
                        return;
                    }
                }
                localStorage.setItem(`jobPortalProfile:${profile.email}`, JSON.stringify({ profile, skills }));
                onProfileSaved(profile, skills, profilePicture);
                showToast('Profile updated successfully');
            };

            const handleResume = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const allowed = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                if (!allowed.includes(file.type)) return showToast('Upload a PDF, DOC, or DOCX file');
                if (file.size > 5 * 1024 * 1024) return showToast('Resume must be smaller than 5 MB');
                const reader = new FileReader();
                reader.onload = () => {
                    const nextResume = { name: file.name, data: reader.result, size: file.size };
                    setResume(nextResume);

        function MessagesTab({ onlyInterviews = false, interviews = [] }) {
            const [activeId, setActiveId] = useState(messageThreads[0].id);
            const [draft, setDraft] = useState('');
            const [showTyping, setShowTyping] = useState(false);
            const [localChats, setLocalChats] = useState(() => {
                const map = {};
                messageThreads.forEach(t => { map[t.id] = t.chat; });
                return map;
            });
            const scrollRef = useRef(null);

            const activeThread = messageThreads.find(t => t.id === activeId);
            const chat = localChats[activeId] || [];

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [chat, showTyping, activeId]);

            const sendMessage = (e) => {
                e.preventDefault();
                const text = draft.trim();
                if (!text) return;
                setLocalChats(prev => ({
                    ...prev,
                    [activeId]: [...prev[activeId], { from: 'me', text, time: 'Now' }]
                }));
                setDraft('');
                setShowTyping(true);
                setTimeout(() => {
                    setShowTyping(false);
                    setLocalChats(prev => ({
                        ...prev,
                        [activeId]: [...prev[activeId], { from: 'them', text: 'Thanks for the update — I will follow up shortly!', time: 'Now' }]
                    }));
                }, 1600);
            };

            if (onlyInterviews) {
                return (
                    <div className="tab-content-area">
                        <div className="panel-card shadow-sm">
                            <div className="d-flex justify-content-between align-items-center mb-4">
                                <div><p className="text-uppercase small fw-semibold text-primary mb-1">Interviews</p><h3 className="fw-bold mb-0">Your interview schedule</h3></div>

                            </div>
                            {interviews.length > 0 ? interviews.map((interview) => (

                                    <span className="badge rounded-pill bg-primary-subtle text-primary">Scheduled</span>
                                </div>
                            )) : <div className="empty-state text-center py-5"><i className="bi bi-calendar-x display-6 text-muted" /><p className="text-muted mt-3 mb-0">No interviews scheduled yet.</p></div>}
                        </div>
                    </div>
                );
            }

            return (
                <div className="tab-content-area">
                    <div className="row g-4">
                        <div className="col-lg-4">
                            <div className="panel-card shadow-sm">
                                <h5 className="fw-bold mb-3">Messages</h5>
                                <div className="thread-list d-flex flex-column gap-1">
                                    {messageThreads.map((t, i) => (
                                        <div
                                            key={t.id}
                                            className={`thread-item ${activeId === t.id ? 'active' : ''}`}
                                            style={{ animationDelay: `${i * 0.06}s` }}
                                            onClick={() => setActiveId(t.id)}
                                        >
                                            <div className="avatar position-relative" style={{ background: t.color }}>
                                                {t.initials}
                                                {t.online && <span className="status-online"></span>}
                                            </div>
                                            <div className="flex-grow-1 overflow-hidden">
                                                <div className="d-flex justify-content-between">
                                                    <span className="fw-semibold small">{t.name}</span>
                                                    <span className="text-muted" style={{ fontSize: '.7rem' }}>{t.time}</span>
                                                </div>
                                                <div className="text-muted" style={{ fontSize: '.72rem' }}>{t.role}</div>
                                                <div className="text-truncate small text-secondary" style={{ maxWidth: '210px' }}>{t.lastMessage}</div>
                                            </div>
                                            {t.unread > 0 && <span className="unread-badge align-self-center">{t.unread}</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="col-lg-8">
                            <div className="chat-panel shadow-sm">
                                <div className="chat-header">
                                    <div className="avatar position-relative" style={{ background: activeThread.color }}>
                                        {activeThread.initials}
                                        {activeThread.online && <span className="status-online"></span>}
                                    </div>
                                    <div>
                                        <div className="fw-semibold">{activeThread.name}</div>
                                        <div className="text-muted small">{activeThread.online ? 'Online now' : 'Offline'}</div>
                                    </div>
                                </div>

                                <div className="chat-messages" ref={scrollRef}>
                                    {chat.map((m, i) => (
                                        <div key={i} className={`d-flex flex-column ${m.from === 'me' ? 'align-items-end' : 'align-items-start'}`} style={{ animationDelay: `${i * 0.04}s` }}>
                                            <div className={`bubble ${m.from}`}>{m.text}</div>
                                            <div className="bubble-time">{m.time}</div>
                                        </div>
                                    ))}
                                    {showTyping && (
                                        <div className="typing-indicator">
                                            <span></span><span></span><span></span>
                                        </div>
                                    )}
                                </div>

                                <form className="chat-input" onSubmit={sendMessage}>
                                    <input
                                        type="text"
                                        className="form-control"
                                        placeholder="Type a message…"
                                        value={draft}
                                        onChange={(e) => setDraft(e.target.value)}
                                    />
                                    <RippleButton type="submit" className="btn btn-primary rounded-circle" style={{ width: '44px', height: '44px' }}>
                                        <i className="bi bi-send-fill"></i>
                                    </RippleButton>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

            const [interviewsOnly, setInterviewsOnly] = useState(false);
